  <link rel="preload" as="image" type="image/avif" media="(prefers-color-scheme: dark)"

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFFFF;
      --text: #000000;
      --grey: #86868B;
      --vh: 1vh;
    }
    @supports (height: 1svh) {
      :root { --vh: 1svh; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --text: #FFFFFF; }
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

    /*
      The page is drawn on a stage the size of the mockup, scaled to fit the
      window and set on its bottom edge, so the hand always meets the bottom.
      Desktop: 2000 × 1422. Phone: 393 × 852. One unit (--u) is one mockup pixel.
    */
    .page {
      position: relative;
      height: calc(var(--vh) * 100);
      overflow: hidden;
    }

    .stage {
      --u: min(calc(100vw / 2000), calc(var(--vh) * 100 / 1422));
      position: absolute;
      left: 50%;
      bottom: 0;
      width: calc(2000 * var(--u));
      height: calc(1422 * var(--u));
      transform: translateX(-50%);
    }

    .copy {
      position: absolute;
      left: calc(250 * var(--u));
      top: calc(476 * var(--u));
      z-index: 1;
    }

    h1 { font-weight: 700; }

    .less {
      display: block;
      font-size: calc(44 * var(--u));
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--grey);
    }

    .more {
      display: block;
      margin-top: calc(20 * var(--u));
      font-size: calc(134 * var(--u));
      line-height: 0.866;
      letter-spacing: -0.02em;
    }

    .badge {
      display: block;
      width: fit-content;
      margin-top: calc(68 * var(--u));
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .badge:hover  { opacity: 0.75; transform: translateY(-1px); }
    .badge:active { opacity: 0.5; transform: none; }
    .badge picture { display: block; }
    .badge img {
      display: block;
      height: calc(96 * var(--u));
      width: auto;
    }

    .note {
      margin-top: calc(18 * var(--u));
      font-size: max(calc(21 * var(--u)), min(12px, calc(29 * var(--u))));
      line-height: 1.3;
      color: var(--grey);
    }

    .hand {
      position: absolute;
      left: calc(650 * var(--u));
      bottom: 0;
      width: calc(977 * var(--u));
    }
    .hand img {
      display: block;
      width: 100%;
      height: auto;
    }

    .footer {
      position: absolute;
      left: calc(112 * var(--u));
      right: calc(114 * var(--u));
      bottom: calc(111 * var(--u));
      z-index: 1;
      display: flex;
      justify-content: space-between;
      font-size: max(13px, calc(21 * var(--u)));
      line-height: 1.2;
    }
    .footer a { transition: opacity 0.2s ease; }
    .footer a:hover { opacity: 0.6; }

    /*
      ── Phone: text on top, the hand below ──
      Sized by the width alone, so the text sits exactly as in the mockup.
      Safari's bars leave less than the mockup's 852 of height; the page
      then scrolls a little to the bottom of the hand and the links.
      Tablets stop growing at 1.3×.
    */
    @media (max-aspect-ratio: 1/1), (max-width: 699px) {
      html, body { height: auto; }
      body { overflow: visible; }
      .page,
      .stage { --u: min(calc(100vw / 393), 1.3px); }
      .page { height: max(calc(var(--vh) * 100), calc(852 * var(--u))); }
      .stage {
        width: calc(393 * var(--u));
        height: calc(852 * var(--u));
      }
      .copy { left: calc(48 * var(--u)); top: calc(47.5 * var(--u)); }
      .less { font-size: calc(24.4 * var(--u)); }
      .more { margin-top: calc(12 * var(--u)); font-size: calc(64 * var(--u)); }
      .badge { margin-top: calc(24.5 * var(--u)); }
      .badge img { height: calc(48 * var(--u)); }
      .note { margin-top: calc(15 * var(--u)); font-size: calc(14.5 * var(--u)); }
      .hand { left: calc(24.8 * var(--u)); width: calc(425 * var(--u)); }
      .footer {
        left: calc(24.5 * var(--u));
        right: calc(24.5 * var(--u));
        bottom: calc(24 * var(--u));
        font-size: calc(14.8 * var(--u));
      }
    }

    /* ── Arrival ── */
    .copy > *, .footer {
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .copy .badge { animation-delay: 0.08s; }
    .copy .note  { animation-delay: 0.12s; }
    .footer      { animation-delay: 0.25s; }
    .hand        { animation: lift 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes lift {
      from { opacity: 0; transform: translateY(6%); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

<body>

  <main class="page">
    <div class="stage">

      <footer class="footer">

        <a href="mailto:herepremg@gmail.com">Get Support</a>
      </footer>

    </div>
  </main>
